name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run zip
      - run: npm run zip:firefox
      - name: Lint Firefox package (AMO rules)
        run: npm run lint:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: .output/*.zip
