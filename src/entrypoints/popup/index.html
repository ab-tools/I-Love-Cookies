<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Love Cookies</title>
  </head>
  <body>
    <main id="app">
      <header class="row">
        <img src="/icon/32.png" alt="" width="24" height="24" />
        <h1 data-i18n="extName">I Love Cookies</h1>
      </header>

      <section class="card" id="status-card">
        <div id="site" class="muted"></div>
        <div id="status" class="status"></div>
        <div id="details" class="muted"></div>
      </section>

      <section class="actions" id="actions">
        <label class="toggle"><input type="checkbox" id="site-active" /> <span data-i18n="popup_siteActive"></span></label>
        <p class="muted small" id="excluded-by" hidden></p>
        <div class="row wrap" id="report-buttons">
          <button id="report" data-i18n="popup_report"></button>
        </div>
      </section>

      <section class="log-row">
        <details>
          <summary class="muted" data-i18n="popup_log"></summary>
          <pre class="log" id="log"></pre>
        </details>
        <nav class="links muted">
          <a id="more-info" target="_blank" rel="noopener" data-i18n="popup_moreInfo"></a>
          <span aria-hidden="true">·</span>
          <a href="#" id="open-options" data-i18n="popup_settings"></a>
        </nav>
      </section>
    </main>

    <div class="dialog-backdrop" id="report-dialog" hidden>
      <div class="dialog card" role="dialog" aria-modal="true" aria-labelledby="report-dialog-title">
        <button type="button" class="dialog-close" id="report-close" data-i18n-aria-label="popup_close">×</button>
        <h2 id="report-dialog-title" data-i18n="popup_problemTitle"></h2>
        <div class="problems" role="radiogroup" aria-labelledby="report-dialog-title">
          <label class="problem"><input type="radio" name="problem" value="bannerVisible" checked /> <span data-i18n="popup_problemBanner"></span></label>
          <label class="problem"><input type="radio" name="problem" value="wrongClick" /> <span data-i18n="popup_problemWrongClick"></span></label>
          <label class="problem"><input type="radio" name="problem" value="pageBroken" /> <span data-i18n="popup_problemPageBroken"></span></label>
          <label class="problem"><input type="radio" name="problem" value="other" /> <span data-i18n="popup_problemOther"></span></label>
        </div>
        <textarea id="problem-note" rows="3" maxlength="500" data-i18n-placeholder="popup_problemNote" hidden></textarea>
        <div class="row" id="report-choice">
          <button class="primary" id="report-github" data-i18n="popup_reportGithub"></button>
          <button class="primary" id="report-anonymous" data-i18n="popup_reportAnonymous"></button>
        </div>
        <p class="muted small" id="report-status" hidden></p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
