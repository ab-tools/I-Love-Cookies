<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Love Cookies</title>
  </head>
  <body>
    <main id="app">
      <header class="row">
        <img src="/icon/32.png" alt="" width="24" height="24" />
        <h1 data-i18n="extName">I Love Cookies</h1>
      </header>

      <section class="card" id="status-card">
        <div id="site" class="muted"></div>
        <div id="status" class="status"></div>
        <div id="details" class="muted"></div>
      </section>

      <section id="setup" class="card" hidden>
        <p data-i18n="popup_setupNeeded"></p>
        <button class="primary" id="open-onboarding" data-i18n="popup_setupButton"></button>
      </section>

      <section class="actions" id="actions">
        <label class="toggle"><input type="checkbox" id="site-active" /> <span data-i18n="popup_siteActive"></span></label>
        <p class="muted small" id="excluded-by" hidden></p>
        <div class="row wrap">
          <button id="withdraw" data-i18n="popup_withdraw" data-i18n-title="popup_withdrawTitle"></button>
          <button id="report" data-i18n="popup_report"></button>
        </div>
        <a id="search-issues" target="_blank" rel="noopener" data-i18n="popup_searchReports"></a>
      </section>

      <section class="card report" id="report-preview" hidden>
        <strong data-i18n="popup_reportTitle"></strong>
        <p class="muted small" data-i18n="popup_reportHint"></p>
        <pre class="log" id="report-text"></pre>
        <div class="row wrap">
          <button class="primary" id="report-open" data-i18n="popup_reportOpen" disabled></button>
          <button id="report-cancel" data-i18n="popup_reportCancel"></button>
        </div>
      </section>

      <details>
        <summary class="muted" data-i18n="popup_log"></summary>
        <pre class="log" id="log"></pre>
      </details>

      <footer class="row muted">
        <a href="#" id="open-options" data-i18n="popup_settings"></a>
        <span id="rules-info"></span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
