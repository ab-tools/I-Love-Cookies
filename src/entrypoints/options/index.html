<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="options_title">I Love Cookies – Settings</title>
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <main class="page">
      <header class="row">
        <img src="/icon/48.png" alt="" width="40" height="40" />
        <h1 data-i18n="options_title"></h1>
      </header>

      <section class="card" id="setup" hidden>
        <p data-i18n="options_setupNeeded"></p>
        <a href="/onboarding.html" data-i18n="options_setupLink"></a>
      </section>

      <section class="card">
        <h2 data-i18n="options_general"></h2>
        <label class="toggle"><input type="checkbox" id="enabled" /> <span data-i18n="options_enabled"></span></label>
        <label class="toggle"><input type="checkbox" id="debug" /> <span data-i18n="options_debug"></span></label>
      </section>

      <section class="card">
        <h2 data-i18n="options_paused"></h2>
        <ul class="site-list" id="paused"></ul>
        <p class="muted small" id="paused-empty" data-i18n="options_pausedEmpty"></p>
      </section>

      <section class="card">
        <h2 data-i18n="options_rules"></h2>
        <label class="toggle"><input type="checkbox" id="remoteRules" /> <span data-i18n="options_remoteRules"></span></label>
        <p class="muted small" id="rules-status"></p>
        <p class="muted small" id="rules-checked"></p>
        <button id="rules-check" data-i18n="options_rulesCheck"></button>
      </section>

      <section class="card">
        <h2 data-i18n="options_about"></h2>
        <p class="muted small" id="about"></p>
        <p class="small"><a href="/onboarding.html" data-i18n="options_whatLink"></a></p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
