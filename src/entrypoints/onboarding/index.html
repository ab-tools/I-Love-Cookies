<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="onboarding_title">Welcome to I Love Cookies</title>
  </head>
  <body>
    <main class="page">
      <header class="row">
        <img src="/icon/48.png" alt="" width="40" height="40" />
        <h1 data-i18n="onboarding_title"></h1>
      </header>

      <section class="card">
        <h2 data-i18n="onboarding_whatTitle"></h2>
        <p data-i18n-html="onboarding_what1"></p>
        <p data-i18n="onboarding_what2"></p>
        <ul>
          <li data-i18n="onboarding_item1"></li>
          <li data-i18n="onboarding_item2"></li>
          <li data-i18n="onboarding_item3"></li>
        </ul>
        <p data-i18n="onboarding_what3"></p>
        <p class="muted" data-i18n="onboarding_what4"></p>
      </section>

      <section class="card">
        <h2 data-i18n="onboarding_payTitle"></h2>
        <p data-i18n="onboarding_pay"></p>
      </section>

      <section class="row">
        <button class="primary" id="accept" data-i18n="onboarding_accept"></button>
        <span id="done" class="ok" hidden data-i18n="onboarding_done"></span>
      </section>
      <p class="muted small" data-i18n="onboarding_privacy"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
